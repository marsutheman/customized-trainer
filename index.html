<style>

</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. Widgets stack top to bottom, an empty plus slot always sits under the last one. Bottom sheets add widgets and exercises, a pop-up menu (long press) manages a widget. */
:root {
  --bg: #fbfbfc;
  --surface: #ffffff;
  --ink: #0e1013;
  --muted: #666b73;
  --line: #14161a;
  --hairline: rgba(14, 16, 19, 0.12);
  --field: #eff0f2;
  --scrim: rgba(14, 16, 19, 0.28);
  --run: #1f8a55;
  --on-run: #ffffff;
  --done-bg: rgba(31, 138, 85, 0.12);
  --danger: #d3302a;
  --shadow: rgba(14, 16, 19, 0.22);
  --font-ui: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --border-w: 1.5px;
  --hair-w: 1px;
  --radius: 22px;
  --r-md: 14px;
  --r-sm: 10px;
  --icon-w: 2px;
  --icon-cap: round;
  --icon-join: round;
  --dur: 180ms;
  --dur-l: 280ms;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-sheet: cubic-bezier(0.2, 0.85, 0.25, 1);
  --ease-pop: cubic-bezier(0.2, 0.9, 0.3, 1.1);
  --lift: 1.03;
  --press: 0.985;
  --pop-from: 0.92;
  --gap: 16px;
  --slot-h: 124px;
  --time-size: 64px;
  --card-bg: var(--surface);
  --card-blur: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0d0f;
    --surface: #17191d;
    --ink: #f1f2f4;
    --muted: #9298a1;
    --line: #e7e9ec;
    --hairline: rgba(241, 242, 244, 0.14);
    --field: #24272c;
    --scrim: rgba(0, 0, 0, 0.5);
    --run: #4fd18b;
    --on-run: #07220f;
    --done-bg: rgba(79, 209, 139, 0.16);
    --danger: #ff6b60;
    --shadow: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0d0f;
  --surface: #17191d;
  --ink: #f1f2f4;
  --muted: #9298a1;
  --line: #e7e9ec;
  --hairline: rgba(241, 242, 244, 0.14);
  --field: #24272c;
  --scrim: rgba(0, 0, 0, 0.5);
  --run: #4fd18b;
  --on-run: #07220f;
  --done-bg: rgba(79, 209, 139, 0.16);
  --danger: #ff6b60;
  --shadow: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; background: var(--bg); }
body {
  min-height: 100%;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  padding-block: 16px;
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; }
input { -webkit-user-select: text; user-select: text; }

.screen {
  flex: 1;
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}
.list { display: flex; flex-direction: column; gap: var(--gap); }
.slot-wrap { position: relative; }

/* ---------- single-slot widgets (timer, start workout, plus) ---------- */
.slot {
  position: relative;
  width: 100%;
  height: calc(var(--n, 1) * var(--slot-h) + (var(--n, 1) - 1) * var(--gap));
  display: grid;
  place-items: center;
  background: var(--card-bg);
  -webkit-backdrop-filter: var(--card-blur);
  backdrop-filter: var(--card-blur);
  color: var(--ink);
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur), height var(--dur) var(--ease);
  outline-offset: 3px;
}
.slot:active { transform: scale(var(--press)); }
.slot:focus-visible { outline: 2px solid var(--ink); }
.slot.lifted {
  z-index: 30;
  transform: scale(var(--lift));
  box-shadow: 0 20px 44px var(--shadow);
}
.slot.start {
  align-content: center;
  justify-items: center;
  gap: 10px;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.slot.start svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.slot .dot {
  position: absolute;
  top: 14px;
  right: 16px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--run);
  animation: pulse 1.4s ease-in-out infinite;
}
.slot .dot[hidden] { display: none; }
@keyframes pulse { 50% { opacity: 0.3; } }

.lcd-host { max-width: 100%; padding: 0 16px; display: grid; place-items: center; }
.plus { width: 46px; height: 46px; fill: none; stroke: currentColor; stroke-width: max(var(--border-w), 1px); stroke-linecap: var(--icon-cap); stroke-linejoin: var(--icon-join); }
.addtxt { font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
.time { font-family: inherit; font-size: calc(var(--time-size) * (1 + (var(--n, 1) - 1) * 0.3)); font-weight: 600; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.time.mini { font-size: 26px; }

/* ---------- workout card ---------- */
.wk-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 12px;
  background: var(--card-bg);
  -webkit-backdrop-filter: var(--card-blur);
  backdrop-filter: var(--card-blur);
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur), height var(--dur) var(--ease);
}
.wk-card.lifted { z-index: 30; transform: scale(calc(1 + (var(--lift) - 1) / 2)); box-shadow: 0 20px 44px var(--shadow); }
.wk-top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.wk-head { flex: 1; min-width: 0; min-height: 38px; display: flex; align-items: center; gap: 10px; padding-left: 4px; }
.wk-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.wk-more { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--hairline); cursor: pointer; }
.wk-more svg { width: 22px; height: 22px; }

.ex { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: var(--hair-w) solid var(--hairline); }
.ex-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-left: 4px; }
.ex-head h3 { margin: 0; min-width: 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.ex-rm { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: var(--r-sm); background: none; color: var(--muted); cursor: pointer; }
.ex-rm svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ex-rm.armed { background: var(--danger); color: #fff; }

.sets { display: flex; flex-direction: column; gap: 4px; }
.set-labels, .set { display: grid; grid-template-columns: 34px minmax(0, 1fr) 60px 64px 40px; gap: 6px; align-items: center; }
.set-labels { padding: 0 4px 2px; color: var(--muted); font-size: 12px; text-align: center; }
.set { padding: 4px; border-radius: var(--r-sm); }
.set.done { background: var(--done-bg); }
.set.shake { animation: shake 0.3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.set-n { width: 34px; height: 40px; display: grid; place-items: center; border: 0; border-radius: var(--r-sm); background: none; font-size: 15px; font-weight: 600; cursor: pointer; }
.set-n .x { display: none; }
.set-n .x svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.set-n.armed { background: var(--danger); color: #fff; }
.set-n.armed .n { display: none; }
.set-n.armed .x { display: block; }
.prev { overflow: hidden; color: var(--muted); font-size: 14px; text-align: center; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.f {
  width: 100%;
  min-width: 0;
  height: 40px;
  padding: 0 4px;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  background: var(--field);
  color: var(--ink);
  font: inherit;
  font-size: 17px;
  font-weight: 500;
  text-align: center;
  -webkit-appearance: none;
  appearance: none;
}
.f::placeholder { color: var(--muted); opacity: 0.55; }
.f:focus { outline: none; border-color: var(--ink); background: var(--surface); }
.chk { width: 40px; height: 40px; display: grid; place-items: center; border: var(--border-w) solid var(--hairline); border-radius: var(--r-sm); background: var(--field); color: var(--muted); cursor: pointer; }
.chk svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.45; }
.set.done .chk { background: var(--run); border-color: var(--run); color: var(--on-run); }
.set.done .chk svg { opacity: 1; }

.btn {
  width: 100%;
  min-height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: var(--border-w) solid var(--hairline);
  border-radius: var(--r-md);
  background: none;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
}
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.line { border-color: var(--line); }
.btn:active, .chk:active, .ex-row:active { opacity: 0.7; }
.btn:focus-visible, .wk-more:focus-visible, .chk:focus-visible, .set-n:focus-visible, .ex-rm:focus-visible, .ex-row:focus-visible, .close:focus-visible, .pick:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.hint {
  margin: auto 0 0;
  padding-top: 8px;
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.45;
  text-align: center;
  text-wrap: balance;
}

.scrim {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur);
}
.scrim.show { opacity: 1; pointer-events: auto; }

/* ---------- pop-up menu ---------- */
.menu {
  position: absolute;
  z-index: 31;
  top: calc(100% + 14px);
  left: 50%;
  width: 236px;
  background: var(--surface);
  border-radius: var(--r-md);
  box-shadow: 0 16px 40px var(--shadow), 0 0 0 1px var(--hairline);
  overflow: hidden;
  transform: translateX(-50%) scale(var(--pop-from));
  transform-origin: 50% 0;
  opacity: 0;
  visibility: hidden;
  transition: transform var(--dur) var(--ease-pop), opacity var(--dur), visibility 0s var(--dur);
}
.menu.up { top: auto; bottom: calc(100% + 14px); transform-origin: 50% 100%; }
.menu.show {
  transform: translateX(-50%) scale(1);
  opacity: 1;
  visibility: visible;
  transition: transform var(--dur) var(--ease-pop), opacity var(--dur), visibility 0s;
}
.wk-top .menu { top: calc(100% + 8px); left: auto; right: 0; transform: scale(var(--pop-from)); transform-origin: 100% 0; }
.wk-top .menu.up { top: auto; bottom: calc(100% + 8px); transform-origin: 100% 100%; }
.wk-top .menu.show { transform: scale(1); }
.menu button {
  width: 100%;
  min-height: 50px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 0;
  background: none;
  font-size: 17px;
  text-align: left;
  cursor: pointer;
}
.menu button + button { border-top: var(--hair-w) solid var(--hairline); }
.menu button:active { background: var(--hairline); }
.menu button:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.menu button.danger { color: var(--danger); }
.menu button .alt { display: none; }
.menu button.armed .lbl { display: none; }
.menu button.armed .alt { display: inline; font-weight: 600; }
.menu svg { flex: none; width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- bottom sheets ---------- */
.sheet {
  position: fixed;
  z-index: 40;
  left: 50%;
  bottom: var(--kb, 0px);
  width: 100%;
  max-width: 430px;
  max-height: calc(var(--vvh, 100vh) - 16px);
  display: flex;
  flex-direction: column;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -10px 40px var(--shadow), 0 0 0 1px var(--hairline);
  transform: translate(-50%, 100%);
  visibility: hidden;
  transition: transform var(--dur-l) var(--ease-sheet), visibility 0s var(--dur-l);
}
.sheet.show {
  transform: translate(-50%, 0);
  visibility: visible;
  transition: transform var(--dur-l) var(--ease-sheet), visibility 0s;
}
.grab { flex: none; width: 38px; height: 5px; margin: 0 auto 12px; border-radius: 3px; background: var(--hairline); }
.sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.close { width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--hairline); cursor: pointer; }
.close svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

.pick-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 0; }
.pick {
  width: 100%;
  display: grid;
  grid-template-columns: 104px minmax(0, 1fr);
  align-items: center;
  gap: 14px;
  padding: 12px;
  border: var(--hair-w) solid var(--hairline);
  border-radius: var(--r-md);
  background: none;
  text-align: left;
  cursor: pointer;
}
.pick:active { background: var(--hairline); }
.pick .thumb { height: 66px; display: grid; place-items: center; padding: 0 10px; border: var(--border-w) solid var(--line); border-radius: var(--r-md); }
.pick .thumb svg.ic { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pick b { display: block; font-size: 17px; font-weight: 600; }
.pick span { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; line-height: 1.35; }

.ex-form { flex: none; margin: 0 0 10px; }
.ex-input {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--r-md);
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  font-size: 17px;
  -webkit-appearance: none;
  appearance: none;
}
.ex-input:focus { outline: none; box-shadow: 0 0 0 3px var(--hairline); }
.ex-list { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; max-height: calc(var(--vvh, 100vh) * 0.5); }
.ex-row {
  width: 100%;
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border: var(--hair-w) solid var(--hairline);
  border-radius: var(--r-md);
  background: none;
  text-align: left;
  cursor: pointer;
}
.ex-row b { min-width: 0; font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
.ex-row span { flex: none; color: var(--muted); font-size: 13px; }
.ex-row.create { border-color: var(--line); }
.ex-row.create b { font-weight: 600; }
.ex-row svg { flex: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.ex-empty { margin: 2px 2px 8px; color: var(--muted); font-size: 14.5px; line-height: 1.45; }
.head-actions { display: flex; align-items: center; gap: 6px; }
.txtbtn { padding: 7px 12px; border: 0; border-radius: var(--r-sm); background: none; font-size: 16px; font-weight: 500; cursor: pointer; }
.txtbtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.ex-row.edit { padding: 6px 6px 6px 8px; cursor: default; }
.ex-row.edit:active { opacity: 1; }
.ex-name {
  flex: 1;
  min-width: 0;
  height: 42px;
  padding: 0 10px;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  background: var(--field);
  color: var(--ink);
  font: inherit;
  font-size: 17px;
  -webkit-appearance: none;
  appearance: none;
}
.ex-name:focus { outline: none; border-color: var(--ink); background: var(--surface); }
.ex-row.edit .ex-rm { width: 42px; height: 42px; }

/* ---------- history widget ---------- */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; border-radius: var(--r-sm); background: var(--field); }
.tab { min-height: 36px; border: 0; border-radius: var(--r-sm); background: none; color: var(--muted); font-size: 15px; font-weight: 500; cursor: pointer; }
.tab.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px var(--shadow); }
.tab:focus-visible, .hhead:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.hlist { display: flex; flex-direction: column; }
.hrow { border-top: var(--hair-w) solid var(--hairline); }
.hrow:first-child { border-top: 0; }
.hhead { width: 100%; min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 8px 4px; border: 0; background: none; text-align: left; cursor: pointer; }
.hmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.hmain b { font-size: 16.5px; font-weight: 600; overflow-wrap: anywhere; }
.hmain span { color: var(--muted); font-size: 13.5px; }
.hdur { flex: none; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.chev { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--dur); }
.hrow.open .chev { transform: rotate(180deg); }
.hbody { display: flex; flex-direction: column; gap: 12px; padding: 2px 4px 14px; }
.hex h4 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 4px 9px; border-radius: 8px; background: var(--field); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.hs-empty { margin: 4px 4px 6px; color: var(--muted); font-size: 14.5px; line-height: 1.45; }
.cap { color: var(--muted); font-size: 13px; }
.readout { margin: 2px 0 4px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.readout b { color: var(--ink); font-weight: 600; }
.chart { display: block; width: 100%; height: auto; touch-action: manipulation; }
.cg { stroke: var(--hairline); stroke-width: 1; }
.cl { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ca { fill: var(--ink); opacity: 0.1; }
.cd { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.ct { fill: var(--muted); font-family: var(--font-ui); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.hit { fill: transparent; cursor: pointer; }
.btn.danger-btn { color: var(--danger); }
.btn.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn .alt { display: none; }
.btn.armed .lbl { display: none; }
.btn.armed .alt { display: inline; }

.toast {
  position: fixed;
  z-index: 70;
  left: 50%;
  bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding: 10px 16px;
  border-radius: var(--r-md);
  background: var(--ink);
